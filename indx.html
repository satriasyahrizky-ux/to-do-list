<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="card">
        <h1>📝 My To-Do List</h1>

        <ul class="todo-list">

            <!-- Item 1 -->
            <li>
                <input type="checkbox" id="task-1">
                <label for="task-1">Belajar HTML</label>
                <ul class="sub-item">
                    <li>
                        <a 
                            href="https://developer.mozilla.org/en-US/docs/Web/HTML" 
                            class="sub-item-link" 
                            target="_blank" 
                            rel="noopener noreferrer"
                        >MDN HTML Docs</a>
                    </li>
                </ul>
            </li>

            <!-- Item 2 -->
            <li>
                <input type="checkbox" id="task-2">
                <label for="task-2">Belajar CSS</label>
                <ul class="sub-item">
                    <li>
                        <a 
                            href="https://developer.mozilla.org/en-US/docs/Web/CSS" 
                            class="sub-item-link" 
                            target="_blank" 
                            rel="noopener noreferrer"
                        >MDN CSS Docs</a>
                    </li>
                </ul>
            </li>

            <!-- Item 3 -->
            <li>
                <input type="checkbox" id="task-3">
                <label for="task-3">Belajar JavaScript</label>
                <ul class="sub-item">
                    <li>
                        <a 
                            href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" 
                            class="sub-item-link" 
                            target="_blank" 
                            rel="noopener noreferrer"
                        >MDN JS Docs</a>
                    </li>
                </ul>
            </li>

            <!-- Item 4 -->
            <li>
                <input type="checkbox" id="task-4">
                <label for="task-4">Belajar Aksesibilitas Web</label>
                <ul class="sub-item">
                    <li>
                        <a 
                            href="https://www.w3.org/WAI/fundamentals/accessibility-intro/" 
                            class="sub-item-link" 
                            target="_blank" 
                            rel="noopener noreferrer"
                        >W3C Accessibility</a>
                    </li>
                </ul>
            </li>

        </ul>
    </main>

</body>
</html>
